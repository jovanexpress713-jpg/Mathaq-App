services:
  mazaq:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MAZAQ_DATA_DIR: /var/lib/mazaq
      MAZAQ_UPLOADS_DIR: /var/lib/mazaq/uploads
      MAZAQ_INITIAL_ADMIN_PASSWORD: ${MAZAQ_INITIAL_ADMIN_PASSWORD:?Set MAZAQ_INITIAL_ADMIN_PASSWORD in .env before first startup}
    volumes:
      - mazaq_data:/var/lib/mazaq
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mazaq_data:
